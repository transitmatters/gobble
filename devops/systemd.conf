[Unit]
Description=gobble
After=network.target

[Service]
Type=simple
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/gobble
Environment=DD_SERVICE="gobble"
Environment=DD_ENV="{{ dd_env }}"
Environment=DD_VERSION="{{ lookup('env', 'GIT_SHA') }}"
Environment=DD_GIT_COMMIT_SHA="{{ lookup('env', 'GIT_SHA') }}"
Environment=DD_GIT_REPOSITORY_URL="github.com/transitmatters/gobble"
Environment=DD_PROFILING_ENABLED="true"
Environment=DD_LOGS_INJECTION="true"
Environment=DD_RUNTIME_METRICS_ENABLED="true"
# Cap glibc malloc arenas: with ~25 threads each churning pandas buffers, per-thread arenas hold freed memory
Environment=MALLOC_ARENA_MAX="2"
ExecStart=/home/ubuntu/.local/bin/uv run ddtrace-run python3 src/gobble.py
Restart=on-failure
RestartSec=5s


[Install]
WantedBy=multi-user.target
