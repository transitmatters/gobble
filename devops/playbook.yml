---
- name: deploy gobble on EC2
  hosts: all
  remote_user: ubuntu
  become_user: ubuntu
  tasks:
    - name: get latest github repo
      git:
        repo: https://github.com/transitmatters/gobble.git
        dest: /home/ubuntu/gobble
        version: "{{ gobble_branch }}"
        force: yes

    - name: Install uv
      shell: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install the Datadog Agent
      become: yes
      become_user: root
      import_role:
        name: datadog.dd.agent

    - name: copy config file
      copy:
        src: local.json
        dest: /home/ubuntu/gobble/config/local.json

    - name: copy systemd service file
      become: yes
      become_user: root
      template:
        src: systemd.conf
        dest: /etc/systemd/system/gobble.service

    - name: copy s3 flush service file
      when: dd_env == "prod"
      become: yes
      become_user: root
      template:
        src: systemd-s3-flush.conf
        dest: /etc/systemd/system/gobble-s3-flush.service

    # Ubuntu 26.04's own Python is 3.14, so there's no need for the deadsnakes PPA
    - name: install python3.14 and cron
      become: yes
      become_user: root
      apt:
        name:
          - python3.14
          - cron
        state: latest
        update_cache: yes

    - name: install rust toolchain
      become: yes
      become_user: root
      apt:
        name:
          - rustc
          - cargo
        state: latest

    - name: install app dependencies
      shell: /home/ubuntu/.local/bin/uv sync --python 3.14
      args:
        chdir: /home/ubuntu/gobble

    # Only a new instance has no data directory. Pull the current and previous service dates' events down before
    # gobble first starts, so it adds to them, and its first upload doesn't replace each file in S3 with only the
    # events written since. gobble still starts if this fails.
    - name: restore recent events from s3 on a new instance
      when: dd_env == "prod"
      shell: /home/ubuntu/.local/bin/uv run python3 src/s3_upload.py --restore
      args:
        chdir: /home/ubuntu/gobble
        creates: /home/ubuntu/gobble/data
      ignore_errors: true

    # Starting it does nothing. Stopping it, when the instance shuts down or is terminated, uploads what gobble wrote
    # since the last cron run.
    - name: upload events to s3 when the instance shuts down
      when: dd_env == "prod"
      become: yes
      become_user: root
      ansible.builtin.systemd_service:
        state: started
        daemon_reload: true
        name: gobble-s3-flush
        enabled: true

    - name: Make sure a service unit is running and enabled
      become: yes
      become_user: root
      ansible.builtin.systemd_service:
        state: started
        name: gobble
        enabled: true

    - name: Restart service
      become: yes
      become_user: root
      ansible.builtin.systemd_service:
        state: restarted
        daemon_reload: true
        name: gobble

    # Only production uploads to the S3 bucket the Data Dashboard reads.
    # flock -n skips a run if the previous one is still going; the skipped run's files go up with the next run
    - name: upload events to s3
      when: dd_env == "prod"
      ansible.builtin.cron:
        name: upload todays events to s3
        minute: "0,30"
        job: "cd /home/ubuntu/gobble && DD_VERSION={{ git_sha }} DD_GIT_COMMIT_SHA={{ git_sha }} DD_SERVICE=gobble DD_ENV=prod flock -n /run/lock/gobble-s3-upload.lock /home/ubuntu/.local/bin/uv run ddtrace-run python3 src/s3_upload.py"

  vars:
    # devops/dry_run.sh overrides these to test-provision a throwaway instance; production uses the defaults
    dd_env: prod
    gobble_branch: main
    datadog_api_key: "{{ lookup('env', 'DD_API_KEY') }}"
    datadog_site: "datadoghq.com"
    git_sha: "{{ lookup('env', 'GIT_SHA') }}"
    datadog_config:
      tags:
        - "git.repository_url:github.com/transitmatters/gobble"
        - "git.commit.sha:{{ lookup('env', 'GIT_SHA') }}"
        - "version:{{ lookup('env', 'GIT_SHA') }}"
      apm_config:
        enabled: true
      process_config:
        enabled: "true" # type: string
      logs_enabled: true
    network_config:
      enabled: true
    system_probe_config:
      enable_oom_kill: true
    datadog_checks:
      python:
        logs:
          - type: file
            path: "/home/ubuntu/gobble/gobble.log"
            service: "gobble"
            source: python
            sourcecategory: sourcecode
          - type: file
            path: "/home/ubuntu/gobble/s3_upload.log"
            service: "gobble"
            source: python
            sourcecategory: sourcecode
      systemd:
        init_config:
        instances:
          - unit_names:
            - gobble.service
