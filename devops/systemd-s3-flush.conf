[Unit]
Description=Upload gobble's latest events to S3 when the instance shuts down
# Units stop in the reverse of their start order. gobble.service stops before this one, so nothing is written
# after this upload, and the network and Datadog Agent stop after it, so the upload and its logs get out.
Before=gobble.service
After=network-online.target datadog-agent.service
Wants=network-online.target

[Service]
Type=oneshot
RemainAfterExit=yes
User=ubuntu
Group=ubuntu
WorkingDirectory=/home/ubuntu/gobble
Environment=DD_SERVICE="gobble"
Environment=DD_ENV="prod"
Environment=DD_VERSION="{{ lookup('env', 'GIT_SHA') }}"
Environment=DD_GIT_COMMIT_SHA="{{ lookup('env', 'GIT_SHA') }}"
ExecStart=/bin/true
# Waits for a cron upload that's still running instead of skipping like cron does, so an older copy of a file
# can't land in S3 after this one
ExecStop=/usr/bin/flock /run/lock/gobble-s3-upload.lock /home/ubuntu/.local/bin/uv run ddtrace-run python3 src/s3_upload.py
# An upload takes 1-2 minutes, but the 03:00 ET cron run also spends about 8 minutes cleaning up old files
TimeoutStopSec=15min

[Install]
WantedBy=multi-user.target
