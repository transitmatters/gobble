[project]
name = "gobble"
version = "1.0.0"
description = "Process MBTA events into a format that can be consumed by the Data Dashboard"
authors = ["TransitMatters Labs <labs@transitmatters.org>"]
requires-python = ">=3.14,<3.15"
license = "MIT"
readme = "README.md"
package-mode = false
dependencies = [
    "pandas==3.0.6",
    "sseclient-py==1.9.0",
    "requests==2.34.2",
    "boto3~=1.42.24",
    "ddtrace~=4.16.0",
    "python-json-logger~=2.0.7",
    "wheel>=0.46.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.18",
    "idna>=3.15",
    # US/Eastern (src/util.py) is missing from some OS time zone databases, e.g. Debian 13 in the container image.
    # pandas 2 installed tzdata for us; pandas 3 only does on Windows.
    "tzdata>=2025.3",
]

[dependency-groups]
dev = [
    "chalice==1.34.0",
    "setuptools>=84.1.0",
    "ruff>=0.14.8",
    "pytest~=9.0.2",
    "pre-commit>=4.4.0",
    "coverage~=7.13.1",
    "debugpy~=1.8.19",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
