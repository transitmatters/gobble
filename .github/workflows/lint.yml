name: lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint code check with Ruff
        run: |
          uv run ruff check src
      - name: Format code check with Ruff
        run: |
          uv run ruff format --check src
